name: Build xread reader

on:
  push:
    branches: [ "main1" ]
  workflow_dispatch:

jobs:
  build-push-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许推送提交和创建 Release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_registry: https://registry.npmmirror.com

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build
        run: |
          [ -d "out" ] && [ "$(ls -A out)" ] || { echo "Build failed - out directory is empty"; exit 1; }

      - name: Commit and push out files
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add out/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: Build latest out files"
            git push origin ${{ github.ref }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tar.gz archive
        run: |
          # 使用 commit SHA 前7位作为文件名
          SHORT_SHA="${GITHUB_SHA:0:7}"
          tar -czf "build_${SHORT_SHA}.tar.gz" out/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          body: "Automatically generated build - Commit: ${{ github.sha }}"
          files: build_*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}